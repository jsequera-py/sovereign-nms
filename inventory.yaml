# Device inventory. Credentials are PER DEVICE, not global — SNMPv3
# devices (FortiGate) and v2c devices coexist here.
#
# Set `recorded:` to replay a saved walk instead of polling live.

devices:
  - name: optiplex
    host: 127.0.0.1
    version: "2c"
    community: public
    timeout_s: 3
    retries: 1

  # Replay of the walk recorded from this same host. Proves the parser
  # produces identical results from a file and from the wire.
  - name: optiplex-replay
    host: 127.0.0.1
    recorded: sim/walks/optiplex_real.snmpwalk

