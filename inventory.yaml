# Device inventory. Credentials are PER DEVICE, not global — SNMPv3
# devices (FortiGate) and v2c devices coexist here.
#
# Set `recorded:` to replay a saved walk instead of polling live.

devices:
  - name: optiplex
    host: 127.0.0.1
    version: "2c"
    community: public
    timeout_s: 3
    retries: 1

  - name: rb951g-lab
    host: 192.168.4.182
    version: "2c"
    community: nmslab
    timeout_s: 3
    retries: 1

  # optiplex-replay moved to inventory.replay.yaml on 2026-08-24. It resolves
  # to the same device row as `optiplex` while reading a frozen file, so on a
  # schedule it wrote a second, stale counter sample at the identical
  # timestamp — which makes a rate undefined rather than merely wrong. Run it
  # by hand when the identity-across-transports check is wanted.

