services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: nms-db
    environment:
      POSTGRES_USER: nms
      POSTGRES_PASSWORD: nms_dev_only
      POSTGRES_DB: nms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nms -d nms"]
      interval: 5s
      timeout: 5s
      retries: 10

  snmpsim:
    image: tandrup/snmpsim:latest
    container_name: nms-snmpsim
    environment:
      EXTRA_FLAGS: "--data-dir=/usr/local/snmpsim/data"
    ports:
      - "127.0.0.1:1161:161/udp"
    volumes:
      - ./sim/data:/usr/local/snmpsim/data:ro
    restart: unless-stopped

volumes:
  pgdata:
