services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: nms-db
    environment:
      POSTGRES_USER: nms
      POSTGRES_PASSWORD: nms_dev_only
      POSTGRES_DB: nms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nms -d nms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Simulated fleet. Each sim/data/<name>.snmprec is reachable using
  # <name> as the SNMP community string.
  snmpsim:
    image: tandrup/snmpsim:latest
    container_name: nms-snmpsim
    command: >
      --data-dir=/usr/local/snmpsim/data
      --agent-udpv4-endpoint=0.0.0.0:161
    ports:
      - "127.0.0.1:1161:161/udp"
    volumes:
      - ./sim/data:/usr/local/snmpsim/data:ro
    restart: unless-stopped

volumes:
  pgdata:
